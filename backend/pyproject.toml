[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-heatshield-api"
version = "0.1.0"
description = "AI HeatShield - Hyperlocal Heat Risk and Urban Decision Intelligence API"
requires-python = ">=3.11,<3.15"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
exclude = [
    "demo_data",
    "demo_data.*",
    "scripts",
    "scripts.*",
]

[tool.fastapi]
entrypoint = "app.main:app"