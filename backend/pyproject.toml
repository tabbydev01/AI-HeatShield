[project]
name = "ai-heatshield-api"
version = "0.1.0"
description = "AI HeatShield - Hyperlocal Heat Risk and Urban Decision Intelligence API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
]

[tool.fastapi]
entrypoint = "app.main:app"